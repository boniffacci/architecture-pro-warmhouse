version: '3.9'

services:
  telemetry-service:
    build:
      context: ./telemetry-service
    container_name: telemetry-service
    ports:
      - "5001:5001"
    restart: unless-stopped

  device-service:
    build:
      context: ./device-service
    container_name: device-service
    ports:
      - "5002:5002"
    restart: unless-stopped